name: agent

on:
  push:
    branches: [main]
    paths:
      - "apps/agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "apps/agent/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --check
      - run: cargo clippy -p shujian-agent -- -D warnings
      - run: cargo test -p shujian-agent

  release:
    name: release-binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
      - run: cargo build --release -p shujian-agent --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: shujian-agent-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/shujian-agent
