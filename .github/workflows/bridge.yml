name: bridge

on:
  push:
    branches: [main]
    paths:
      - "apps/bridge/**"
      - "packages/shared-types/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths:
      - "apps/bridge/**"
      - "packages/shared-types/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bridge.yml"
  workflow_dispatch:

# Deployment is handled by Railway's GitHub integration
# (auto-deploys apps/bridge/ on pushes to main).
# This workflow is the PR gate: typecheck has to pass before merge.

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@shujian/shared-types' typecheck
      - run: cd apps/bridge && bun run typecheck
