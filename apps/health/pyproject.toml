[project]
name = "shujian-health"
version = "0.1.0"
description = "Oura + CGM health data sync and storyline analysis for Shujian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "apscheduler>=3.10.4",
    "httpx>=0.28.0",
]

[project.scripts]
health = "health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health"]
