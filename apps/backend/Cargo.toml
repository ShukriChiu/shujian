[package]
name = "shujian-backend"
version = "0.1.0"
edition = "2024"
description = "Multi-tenant control plane: identity, tenants, sessions, audit"
license = "MIT"

[[bin]]
name = "shujian-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
hyper = "1"

# DB
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }

# Serde + types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Crypto
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"
rand_core = { version = "0.9", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# AES-256-GCM for vault secret encryption (DEK + KEK envelope).
aes-gcm = { version = "0.10", features = ["aes", "std"] }

# HTTP client for outbound calls (onion-agent mint-token in P3, future
# AWS KMS Decrypt API, etc.). Vault KEK itself is loaded from env at boot
# so reqwest is not on the secret read path.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Errors / logs
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Misc
async-trait = "0.1"
once_cell = "1"
dotenvy = "0.15"

